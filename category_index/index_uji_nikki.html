      <h2>カテゴリ：仁木氏（にっきし）</h2>
    </div>
    <div class="common_contents">
      <div class="contents_h5">
        <p>
        仁木氏の遠祖は、足利氏初代源義康の子義清である。義舜は木曽義仲と共に平家軍を撃破して入京したが、1183（寿永2）年に義仲軍は備中国水島の戦いで平家軍に大敗、義舜は戦死する。このため、足利宗家は弟の義兼が継いだ。その後足利義清の孫実国が三河国額田郡仁木郷に移住し、仁木太郎を称したのが仁木氏の始まりである。弟の義季は細川次郎と称した。仁木・細川氏は足利一門であったが所領の規模・価格ともに小さく、高一族と同様足利氏の被官だったと推定されている。
      </p>
